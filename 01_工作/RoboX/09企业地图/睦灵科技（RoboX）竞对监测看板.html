<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>睦灵科技（RoboX）竞对监测看板</title>
<style>
/* ================= 设计令牌 ================= */
:root{
  --bg0:#06080F; --bg1:#0B1020; --bg2:#16233A;
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.06);
  --glass:rgba(255,255,255,.045);
  --txt:#E8EEFC; --txt2:#93A5C8; --txt3:#5C6B8C;
  --pri:#2F6BFF; --acc:#00D0B0; --deep:#1E3A8A;
  --p0:#FF5C5C; --p1:#FF9F45; --p2:#8C9E5A;
  --ok:#34D399; --warn:#F5A623;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh; color:var(--txt);
  background:
    radial-gradient(1200px 700px at 10% -12%, rgba(47,107,255,.20), transparent 62%),
    radial-gradient(900px 620px at 90% 4%, rgba(0,208,176,.15), transparent 62%),
    radial-gradient(700px 700px at 50% 120%, rgba(30,58,138,.28), transparent 65%),
    linear-gradient(180deg,#06080F 0%,#0B1020 42%,#06080F 100%);
  background-attachment:fixed;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  font-size:14px; font-weight:400; line-height:1.72; -webkit-font-smoothing:antialiased;
}
a{color:var(--acc);text-decoration:none}
::selection{background:rgba(0,208,176,.28)}

/* ================= 顶栏 ================= */
header.nav{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:12px 26px;
  background:rgba(6,8,15,.78); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:210px}
.brand b{font-size:15px;letter-spacing:.4px}
.brand span{font-size:11px;color:var(--txt3);letter-spacing:1.4px;text-transform:uppercase}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{
  font:inherit; font-size:13px; color:var(--txt2);
  background:transparent; border:1px solid transparent; border-radius:10px;
  padding:7px 13px; cursor:pointer;
  transition:all .16s ease;
}
nav.tabs button:hover{color:var(--txt);background:rgba(255,255,255,.05)}
nav.tabs button.on{
  color:#fff; background:linear-gradient(135deg,rgba(47,107,255,.30),rgba(0,208,176,.22));
  border-color:rgba(0,208,176,.42); box-shadow:0 0 18px -6px rgba(0,208,176,.55);
}
.grow{flex:1}
.back-link{
  font-size:12.5px; color:var(--txt2); border:1px solid var(--line);
  border-radius:10px; padding:7px 13px; white-space:nowrap;
  transition:all .16s ease;
}
.back-link:hover{color:var(--txt);border-color:rgba(0,208,176,.5);background:rgba(0,208,176,.08)}

main{max-width:1520px;margin:0 auto;padding:26px 26px 90px}
.view{display:none;animation:rise .34s cubic-bezier(.22,.8,.3,1)}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= 通用块 ================= */
.h1{font-size:28px;font-weight:700;letter-spacing:.3px;margin:0 0 6px}
.h2{font-size:17px;font-weight:600;margin:30px 0 12px;display:flex;align-items:center;gap:9px}
.h2:before{content:"";width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--pri))}
.sub{color:var(--txt2);font-size:13.5px}
.muted{color:var(--txt3)}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--line); border-radius:16px;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 20px 44px -28px rgba(0,0,0,.95);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.card.hoverable{cursor:pointer}
.card.hoverable:hover{transform:translateY(-4px);border-color:rgba(0,208,176,.42);box-shadow:0 0 0 1px rgba(0,208,176,.22),0 24px 52px -28px rgba(0,208,176,.45)}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;letter-spacing:.6px;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);
  color:var(--txt2);background:rgba(255,255,255,.03);white-space:nowrap;
}
.tag.p0{color:#FFD9D9;border-color:rgba(255,92,92,.5);background:rgba(255,92,92,.14)}
.tag.p1{color:#FFE8CE;border-color:rgba(255,159,69,.5);background:rgba(255,159,69,.13)}
.tag.p2{color:#E4EBD2;border-color:rgba(140,158,90,.5);background:rgba(140,158,90,.13)}
.tag.watch{color:#CFF5EE;border-color:rgba(0,208,176,.5);background:rgba(0,208,176,.13)}
.tag.pending{color:#FFD9A8;border-color:rgba(245,166,35,.45);background:rgba(245,166,35,.12)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ================= 总览仪表盘 ================= */
.hero{padding:26px 28px;margin-bottom:20px;position:relative;overflow:hidden}
.hero:after{
  content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,208,176,.22),transparent 68%);filter:blur(6px);
}
.hero .tagline{margin-top:12px;font-size:13px;color:var(--acc);letter-spacing:.3px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:8px}
.stat{padding:18px 20px}
.stat .k{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt3)}
.stat .v{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1.25;margin-top:4px;
  background:linear-gradient(135deg,#fff,#8FD9FF 55%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .d{font-size:12.5px;color:var(--txt2)}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.quick{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px}
.quick .card{min-width:264px;max-width:264px;padding:16px 16px 14px}
.cname{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calias{font-size:11.5px;color:var(--txt3);font-family:var(--mono);margin-top:2px}
.crel{margin-top:9px;font-size:12.5px;color:var(--txt2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{margin-top:11px;display:flex;gap:6px;flex-wrap:wrap}

.siglist{display:flex;flex-direction:column;gap:9px}
.sig{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.028);border:1px solid var(--line-soft)}
.sig .bar{width:3px;border-radius:2px;flex:0 0 3px;background:var(--pri)}
.sig .body{flex:1;min-width:0}
.sig .top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.sig .co{font-weight:600}
.sig .dt{font-family:var(--mono);color:var(--txt2);font-size:11.5px}
.sig .tx{margin-top:4px;font-size:12.8px;color:var(--txt2)}
.sig .im{margin-top:4px;font-size:12px;color:var(--txt3)}

/* ================= 筛选条 ================= */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 18px}
.filters select,.filters input{
  font:inherit;font-size:13px;color:var(--txt);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;
  padding:8px 11px;outline:none;transition:border-color .16s ease;
}
.filters select:focus,.filters input:focus{border-color:rgba(0,208,176,.55)}
.filters input{min-width:220px}
.filters option{background:#0B1020;color:var(--txt)}

/* ================= 详情视图 ================= */
.detail-head{padding:20px 22px;margin-bottom:16px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.detail-head .left{flex:1;min-width:280px}
.detail-head .name{font-size:24px;font-weight:700}
.detail-head .tags{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(300px,.85fr);gap:16px;align-items:start}
@media(max-width:1080px){.detail-grid{grid-template-columns:1fr}}
.dim{border:1px solid var(--line-soft);border-radius:12px;margin-bottom:9px;background:rgba(255,255,255,.025);overflow:hidden}
.dim>summary{
  cursor:pointer;list-style:none;padding:12px 15px;display:flex;align-items:center;gap:10px;
  font-size:13.5px;font-weight:600;transition:background .16s ease;
}
.dim>summary::-webkit-details-marker{display:none}
.dim>summary:hover{background:rgba(255,255,255,.045)}
.dim>summary .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.dim>summary .hint{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:400}
.dim .content{padding:0 16px 15px 32px;font-size:13.2px;color:var(--txt2);line-height:1.85;white-space:pre-wrap}
.dim.pending .content{border-left:2px dashed rgba(245,166,35,.5);margin-left:16px;padding-left:14px}

.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:linear-gradient(180deg,rgba(0,208,176,.6),rgba(47,107,255,.25),transparent)}
.tl .node{position:relative;margin-bottom:16px}
.tl .node:before{
  content:"";position:absolute;left:-22px;top:6px;width:9px;height:9px;border-radius:50%;
  background:#0B1020;border:2px solid var(--pri);
}
.tl .node.newest:before{border-color:var(--acc);box-shadow:0 0 0 4px rgba(0,208,176,.16);animation:pulse 2.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(0,208,176,.10)}50%{box-shadow:0 0 0 7px rgba(0,208,176,.20)}}
.tl .d{font-family:var(--mono);font-size:11.5px;color:var(--txt3)}
.tl .t{margin-top:3px;font-size:13px;color:var(--txt)}
.tl .s{margin-top:4px;font-size:11.5px;color:var(--txt3)}

/* ================= 全景层 ================= */
.track{margin-bottom:22px;padding:18px 20px}
.track .name{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:10px}
.track .feat{margin-top:8px;font-size:12.8px;color:var(--txt2)}
.track .insight{
  margin-top:10px;font-size:12.8px;color:#CFE0FF;padding:10px 13px;border-radius:10px;
  background:linear-gradient(135deg,rgba(47,107,255,.14),rgba(0,208,176,.08));
  border-left:3px solid var(--acc);
}
.tablewrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line-soft);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1080px;font-size:12.6px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-soft)}
th{
  position:sticky;top:0;background:#0C1428;
  font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--txt3);font-weight:600;
}
tbody tr{transition:background .14s ease}
tbody tr:hover{background:rgba(0,208,176,.055)}
td.co{font-weight:600;color:var(--txt);white-space:nowrap}
td.clamp div{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--txt2);max-width:330px}

/* ================= 口径页 ================= */
.doc{padding:20px 22px}
.doc ul{margin:8px 0 0;padding-left:20px}
.doc li{margin:5px 0;color:var(--txt2);font-size:13.2px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.kv .cell{padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft)}
.kv .cell b{display:block;font-size:13.4px;margin-bottom:4px}
.kv .cell span{font-size:12.6px;color:var(--txt2)}
.flow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flow .step{
  flex:1;min-width:190px;padding:12px 14px;border-radius:12px;
  background:linear-gradient(135deg,rgba(47,107,255,.12),rgba(0,208,176,.06));
  border:1px solid var(--line-soft);font-size:12.6px;color:var(--txt2);
}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:11.8px;color:var(--txt3);line-height:1.9}
@media(max-width:640px){
  main{padding:16px 14px 70px}
  header.nav{padding:10px 14px;gap:10px}
  .h1{font-size:22px}
  .grid-cards{grid-template-columns:1fr}
  .tablewrap table{min-width:900px}
}
</style>
</head>
<body>
<header class="nav">
  <div class="brand">
    <b>RoboX 竞对监测看板</b>
    <span>Competitive Intelligence</span>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="overview" class="on">总览仪表盘</button>

<main>

</main>

const DATA = {"meta":{"title":"睦灵科技（RoboX）竞对监测看板","subtitle":"全景层（5 赛道 · 26 家）+ 重点层（8 家 + 1 家在测）｜以变化量为核心的持续竞对情报","version":"v1.0","date":"2026-09-12","author":"Anson（杜岩松）整理 / 内部使用","audiences":"内部团队（含 Anson 本人）；配套读本为《睦灵科技（RoboX）生态图谱》与《企业地图（本体）》","tagline":"以人类操作数据、灵巧末端与具身大脑为核心，构建手眼脑协同的物理智能系统。","sourceNote":"全景层迁移自 2026-08-08《具身智能赛道监测看板》；重点层为公开信息与旧看板条目升级，逐条标注日期与来源。","disclaimer":"本看板为内部决策参考，非投资建议。公开信息可能存在滞后与口径差异；标注「待核实」的字段未经确证，引用前请回溯原始来源。"},"layers":[{"key":"focus","label":"重点层","desc":"对 RoboX 有直接竞争或强对标关系的关键对手，按 9 维建档、每月增量监测。"},{"key":"panorama","label":"全景层","desc":"5 个细分赛道的行业格局视野，按季度全量复核，用于判断赛道重心迁移。"}],"dimensions":[{"key":"identity","label":"身份与融资","hint":"主体、国别、成立时间、创始人、融资轮次与估值；标注来源与日期，未披露写「待核实」。"},{"key":"tech","label":"技术路线","hint":"模型范式（VLA / 世界模型 / 分层架构）、核心主张，以及与 RoboX「手眼脑协同」的同位或错位关系。"},{"key":"data","label":"数据资产","hint":"数据来源（真机 / 仿真 / 视频众包）、规模、采集方式，是否包含触觉与力觉——这是 RoboX 的核心比较维度。"},{"key":"hardware","label":"硬件与末端","hint":"是否自研本体、手部自由度、触觉传感方案、是否绑定特定本体。"},{"key":"scene","label":"场景与客户","hint":"已落地的真实场景、付费方、客户名单；严格区分「demo 展示」与「验收交付」。"},{"key":"business","label":"商业模式与定价","hint":"卖硬件 / 卖模型授权 / 按结果付费；价格锚点与毛利结构。"},{"key":"team","label":"团队与人才风险","hint":"创始背景、人才密度、扩张速度；仅写公司与公开招聘层面的信号，不涉及个人动向。"},{"key":"threat","label":"对 RoboX 的威胁与启示","hint":"威胁等级判定 + 8 特征场景可做性对照 + 对 RoboX 的具体行动启示。"},{"key":"timeline","label":"动态时间线","hint":"只记变化量（delta）：时间、维度、变化、来源、影响。"}],"tracks":[{"key":"tactile","label":"触觉感知与模型","feature":"两条技术路线分化：伪标签路线（从视频推断触觉）vs 物理传感器路线（真实触觉信号）。核心竞争维度是数据规模与触觉融入预训练模型的进度。","insight":"智在无界以 50 万小时 Ego 数据在规模上大幅领先；帕西尼以传感器市占率与降价建立成本护城河。伪标签 vs 物理传感器是赛道核心分歧——前者规模化快但牺牲真实性，后者真实但采集成本高，RoboX 属于后者阵营。"},{"key":"hand","label":"灵巧手 / 末端执行器","feature":"2025 年出货超 2 万台，2026 年预计 7 万台。行业从「参数竞赛」转向「量产稳定性 + 真实场景价值」。","insight":"灵心巧手以 80%+ 高 DOF 市占率成为龙头，因时是量产先驱，临界点借智元拆分创最快独角兽纪录。灵巧手对 RoboX 是「下游载体」而非竞争——它们是 RoboX System 1/0 端侧模型的潜在部署对象。"},{"key":"body","label":"整机本体 / 人形机器人","feature":"2026 上半年国内具身智能融资 935 亿元，22 家估值超百亿。整机公司从「demo 驱动」转向「量产 + 场景」驱动。关键分化：全身人形 vs 双臂桌面，ToB 商业服务 vs ToC 家庭 /* ---------------- 基础工具 ---------------- */
var COMPS = DATA.companies;
var FOCUS = COMPS.filter(function(c){return c.layer==='focus';});
var PANO  = COMPS.filter(function(c){return c.layer==='panorama';});
var DIMS  = DATA.dimensions.filter(function(d){return d.key!=='timeline';});
var TRACKS= DATA.tracks;
var DIMCOLOR = {identity:'#2F6BFF',tech:'#00D0B0',data:'#7C5CFF',hardware:'#F5A623',
                scene:'#34D399',business:'#FF9F45',team:'#FF5C5C',threat:'#FF3D71'};
var PRICOLOR= {P0:'#FF5C5C',P1:'#FF9F45',P2:'#8C9E5A'};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function trackLabel(k){for(var i=0;i<TRACKS.length;i++){if(TRACKS[i].key===k)return TRACKS[i].label;}return k;}
function dimLabel(k){for(var i=0;i<DATA.dimensions.length;i++){if(DATA.dimensions[i].key===k)return DATA.dimensions[i].label;}return k;}
function pTag(p){return '<span class="tag '+(p||'').toLowerCase()+'">'+esc(p||'—')+'</span>';}
function byId(id){for(var i=0;i<COMPS.length;i++){if(COMPS[i].id===id)return COMPS[i];}return null;}

/* 汇总全局信号（含公司名与维度） */
var SIGNALS=[];
COMPS.forEach(function(c){
  (c.signals||[]).forEach(function(s){
    SIGNALS.push({company:c.name,cid:c.id,companyObj:c,date:s.date||'',dimension:s.dimension||'',
      delta:s.delta||'',source:s.source||'',impact:s.impact||'',confidence:s.confidence||''});
  });
});
SIGNALS.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});

/* 待核实字段统计 */
function pendingCount(){
  var n=0;
  COMPS.forEach(function(c){
    DIMS.forEach(function(d){
      var v=(c.dims||{})[d.key]||'';
      if(v.indexOf('待核实')>=0||v.indexOf('未披露')>=0)n++;
    });
  });
  return n;
}
function draftCount(){return COMPS.filter(function(c){return c.verified===false;}).length;}
function latestSignal(c){
  var s=(c.signals||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  return s.length?s[0]:null;
}

/* ---------------- 视图切换 ---------------- */
var current='overview';
function show(v){
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('on');});
  var el=document.getElementById('v-'+v);
  if(el)el.classList.add('on');
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v);});
  current=v;
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button[data-v]');
  if(b)show(b.dataset.v);
});

function signalCard(s){
  var col=DIMCOLOR[s.dimension]||'#2F6BFF';
  return '<div class="sig"><div class="bar" style="background:'+col+'"></div><div class="body">'
    +'<div class="top"><span class="co">'+esc(s.company)+'</span>'
    +'<span class="tag">'+esc(dimLabel(s.dimension))+'</span>'
    +'<span class="dt">'+esc(s.date)+'</span></div>'
    +'<div class="tx">'+esc(s.delta)+'</div>'
    +(s.impact?'<div class="im">影响：'+esc(s.impact)+'</div>':'')
    +(s.source?'<div class="im">来源：'+esc(s.source)+(s.confidence?' · 置信度 '+esc(s.confidence):'')+'</div>':'')
    +'</div></div>';
}

    +'<div class="cname">'+esc(c.name)+pTag(c.priority)
    +(c.watchOnly?'<span class="tag watch">在测竞对</span>':'')+'</div>'
    +'<div class="calias">'+esc(c.alias||'')+' · '+esc(c.origin)+'</div>'
    +'<div class="crel">'+esc(c.roboxRelation)+'</div>'
    +'<div class="cmeta"><span class="tag">'+esc(trackLabel(c.trackKey))+'</span>'
    +(c.verified===false?'<span class="tag pending">含待核实字段</span>':'')
    +(s?'<span class="tag">最近 '+esc(s.date)+'</span>':'')+'</div></div>';
}
function renderOverview(){
  var w=(DATA.watchPlan&&DATA.watchPlan.cadence)||'';
  document.getElementById('v-overview').innerHTML=
   '<div class="card hero">'
   +'<div class="h1">'+esc(DATA.meta.title)+'</div>'
   +'<div class="sub">'+esc(DATA.meta.subtitle)+'</div>'
   +'<div class="tagline">'+esc(DATA.meta.tagline)+'</div>'
   +'<div class="muted" style="margin-top:10px;font-size:12px">'+esc(DATA.meta.version)+' · '+esc(DATA.meta.date)+' · '+esc(DATA.meta.author)+'</div>'

   +'<div class="stats">'
   +'<div class="card stat"><div class="k">重点层</div><div class="v">'+FOCUS.length+'</div><div class="d">家深度建档（含 '+FOCUS.filter(function(c){return c.watchOnly;}).length+' 家在测竞对）</div></div>'
   +'<div class="card stat"><div class="k">全景层</div><div class="v">'+PANO.length+'</div><div class="d">5 个细分赛道</div></div>'
   +'<div class="card stat"><div class="k">待核实字段</div><div class="v">'+pendingCount()+'</div><div class="d">覆盖 '+draftCount()+' 家公司档案</div></div>'
   +'<div class="card stat"><div class="k">信号总量</div><div class="v">'+SIGNALS.length+'</div><div class="d">只记变化量（delta）</div></div>'
   +'</div>'
   +'<div class="h2">最近信号流</div>'
   +'<div class="siglist">'+(SIGNALS.length?SIGNALS.slice(0,8).map(signalCard).join(''):'<div class="muted">暂无信号，采集管道跑通后自动汇入。</div>')+'</div>'
   +'<div class="h2">重点层速览</div>'
   +'<div class="quick">'+FOCUS.map(miniCard).join('')+'</div>'
   +'<div class="h2">监测节奏</div>'
   +'<div class="card doc"><div class="sub">'+esc(w)+'</div></div>';

/* ---------------- 重点层网格 ---------------- */
var focusFilter={p:'',t:'',q:''};
function renderFocus(){
  var tracks={};
  FOCUS.forEach(function(c){tracks[c.trackKey]=trackLabel(c.trackKey);});
  var opts=Object.keys(tracks).map(function(k){return '<option value="'+esc(k)+'">'+esc(tracks[k])+'</option>';}).join('');
  document.getElementById('v-focus').innerHTML=
   '<div class="h1">重点层 · 深度建档</div>'
   +'<div class="sub">对 RoboX 有直接竞争或强对标关系的关键对手，按 9 维建档、每月增量监测。点击卡片进入 9 维详情与动态时间线。</div>'
   +'<div class="filters">'
   +'<select id="fp"><option value="">全部优先级</option><option value="P0">P0 · 直接竞争</option><option value="P1">P1 · 强对标</option><option value="P2">P2 · 观察</option></select>'
   +'<select id="ft"><option value="">全部赛道</option>'+opts+'</select>'
   +'<input id="fq" placeholder="搜索公司 / 别名 / 关系">'
   +'</div><div class="grid-cards" id="fgrid"></div>';
  document.getElementById('fp').value=focusFilter.p;
  document.getElementById('ft').value=focusFilter.t;
  document.getElementById('fq').value=focusFilter.q;
  function paint(){
    var list=FOCUS.filter(function(c){
      if(focusFilter.p&&c.priority!==focusFilter.p)return false;
      if(focusFilter.t&&c.trackKey!==focusFilter.t)return false;
      if(focusFilter.q){
        var q=focusFilter.q.toLowerCase();
        var hay=(c.name+' '+(c.alias||'')+' '+c.roboxRelation+' '+(c.origin||'')).toLowerCase();
        if(hay.indexOf(q)<0)return false;
      }
      return true;
    });
    document.getElementById('fgrid').innerHTML=list.length?list.map(miniCard).join('')
      :'<div class="muted">没有符合条件的公司。</div>';
  }
  document.getElementById('fp').onchange=function(e){focusFilter.p=e.target.value;paint();};
  document.getElementById('ft').onchange=function(e){focusFilter.t=e.target.value;paint();};
  document.getElementById('fq').oninput=function(e){focusFilter.q=e.target.value;paint();};
  paint();
}

/* ---------------- 详情 ---------------- */
function renderDetail(id){
  var c=byId(id);
  var box=document.getElementById('v-detail');
  if(!c){box.innerHTML='<div class="muted">未找到该公司档案。</div>';return;}
  var sigs=(c.signals||[]).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var dimsHtml=DIMS.map(function(d){
    var v=(c.dims||{})[d.key]||'未披露 / 待核实。';
    var pending=(v.indexOf('待核实')>=0||v.indexOf('未披露')>=0);
    return '<details class="dim'+(pending?' pending':'')+'"'+(d.key==='threat'?' open':'')+'>'
      +'<summary><span class="dot" style="background:'+(DIMCOLOR[d.key]||'#2F6BFF')+'"></span>'
      +esc(d.label)+(pending?'<span class="tag pending" style="margin-left:8px">待核实</span>':'')
      +'<span class="hint">'+esc(d.hint.slice(0,26))+'…</span></summary>'
      +'<div class="content">'+esc(v)+'</div></details>';
  }).join('');
  var tl=sigs.length?sigs.map(function(s,i){
    return '<div class="node'+(i===0?' newest':'')+'">'
      +'<div class="d">'+esc(s.date)+' · '+esc(dimLabel(s.dimension))+'</div>'
      +'<div class="t">'+esc(s.delta)+'</div>'
      +(s.impact?'<div class="s">影响：'+esc(s.impact)+'</div>':'')
      +(s.source?'<div class="s">来源：'+esc(s.source)+(s.confidence?' · 置信度 '+esc(s.confidence):'')+'</div>':'')
      +'</div>';
  }).join(''):'<div class="muted">暂无信号记录。</div>';
  box.innerHTML=
   '<div style="margin-bottom:12px"><button class="back-link" id="backFocus" style="cursor:pointer">← 返回重点层</button></div>'
   +'<div class="card detail-head">'
   +'<div class="left"><div class="name">'+esc(c.name)+'</div>'
   +'<div class="calias">'+esc(c.alias||'')+' · '+esc(c.origin||'')+'</div>'
   +'<div class="sub" style="margin-top:9px">'+esc(c.roboxRelation)+'</div></div>'
   +'<div class="tags">'+pTag(c.priority)
   +'<span class="tag">'+esc(trackLabel(c.trackKey))+'</span>'
   +(c.watchOnly?'<span class="tag watch">在测竞对</span>':'')
   +(c.verified===false?'<span class="tag pending">含待核实字段</span>':'<span class="tag p2">字段已核实</span>')
   +'<span class="tag">更新 '+esc(c.lastUpdate||'')+'</span></div></div>'
   +'<div class="detail-grid">'
   +'<div>'+dimsHtml+'</div>'
   +'<div class="card doc"><div class="h2" style="margin-top:0">动态时间线</div><div class="tl">'+tl+'</div></div>'
   +'</div>';
  document.getElementById('backFocus').onclick=function(){show('focus');};
}

/* ---------------- 全景层 ---------------- */
var panoQ='';
function renderPanorama(){
  document.getElementById('v-panorama').innerHTML=
   '<div class="h1">全景层 · 赛道格局</div>'
   +'<div class="sub">迁移自 2026-08-08《具身智能赛道监测看板》，5 个细分赛道共 '+PANO.length+' 家。跨赛道公司（帕西尼、智在无界、穹彻智能）在其参与的每个赛道分组中分别体现；重点层公司同样纳入所属赛道，便于横向比较。</div>'
   +'<div class="filters"><input id="pq" placeholder="搜索公司 / 创始人 / 技术路线"></div>'
   +'<div id="pgroups"></div>';
  document.getElementById('pq').value=panoQ;
  function paint(){
    var q=panoQ.toLowerCase();
    var out=TRACKS.map(function(t){
      var list=COMPS.filter(function(c){
        return (c.trackKeys||[c.trackKey]).indexOf(t.key)>=0;
      }).filter(function(c){
        if(!q)return true;
        var hay=(c.name+' '+(c.alias||'')+' '+(c.dims.identity||'')+' '+(c.dims.tech||'')+' '+c.roboxRelation).toLowerCase();
        return hay.indexOf(q)>=0;
      });
      if(!list.length)return '';
      var rows=list.map(function(c){
        var d=c.dims;
        return '<tr data-goto="'+esc(c.id)+'" style="cursor:pointer">'
          +'<td class="co">'+esc(c.name)+'<div class="calias">'+esc(c.alias||'')+'</div></td>'
          +'<td>'+esc(c.origin)+'</td>'
          +'<td>'+pTag(c.priority)+(c.layer==='focus'?'<div style="margin-top:5px"><span class="tag watch">重点层</span></div>':'')+'</td>'
          +'<td>'+esc(c.roboxRelation)+'</td>'
          +'<td class="clamp"><div>'+esc(d.identity||'—')+'</div></td>'
          +'<td class="clamp"><div>'+esc(d.tech||'—')+'</div></td>'
          +'<td class="clamp"><div>'+esc(d.hardware||'—')+'</div></td>'
          +'<td class="clamp"><div>'+esc(d.data||'—')+'</div></td>'
          +'</tr>';
      }).join('');
      return '<div class="card track">'
        +'<div class="name">'+esc(t.label)+'<span class="tag">'+list.length+' 家</span></div>'
        +'<div class="feat"><b class="muted">赛道特征 · </b>'+esc(t.feature)+'</div>'
        +'<div class="insight"><b>关键洞察 · </b>'+esc(t.insight)+'</div>'
        +'<div class="tablewrap"><table><thead><tr>'
        +'<th>公司</th><th>国别</th><th>优先级</th><th>对 RoboX 关系</th>'
        +'<th>身份与融资</th><th>技术路线</th><th>硬件与末端</th><th>数据资产</th>'
        +'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    }).join('');
    document.getElementById('pgroups').innerHTML=out||'<div class="muted">没有符合条件的公司。</div>';
  }
  document.getElementById('pq').oninput=function(e){panoQ=e.target.value;paint();};
  paint();
}

/* ---------------- 信号时间线 ---------------- */
var sigFilter={c:'',d:''};
function renderSignals(){
  var co=[],seen={};
  SIGNALS.forEach(function(s){if(!seen[s.cid]){seen[s.cid]=1;co.push(s);}});
  var coOpt=co.map(function(s){return '<option value="'+esc(s.cid)+'">'+esc(s.company)+'</option>';}).join('');
  var dOpt=DIMS.map(function(d){return '<option value="'+esc(d.key)+'">'+esc(d.label)+'</option>';}).join('');
  document.getElementById('v-signals').innerHTML=
   '<div class="h1">信号时间线</div>'
   +'<div class="sub">全局变化量视图：只记 delta，不重复档案。点击任一条可回溯到对应公司档案。</div>'
   +'<div class="filters">'
   +'<select id="sc"><option value="">全部公司</option>'+coOpt+'</select>'
   +'<select id="sd"><option value="">全部维度</option>'+dOpt+'</select>'
   +'</div><div id="sigbody"></div>';
  document.getElementById('sc').value=sigFilter.c;
  document.getElementById('sd').value=sigFilter.d;
  function paint(){
    var list=SIGNALS.filter(function(s){
      if(sigFilter.c&&s.cid!==sigFilter.c)return false;
      if(sigFilter.d&&s.dimension!==sigFilter.d)return false;
      return true;
    });
    if(!list.length){document.getElementById('sigbody').innerHTML='<div class="muted">暂无信号，采集管道跑通后自动汇入。</div>';return;}
    var groups={},order=[];
    list.forEach(function(s){
      var m=(s.date||'').slice(0,7)||'未标日期';
      if(!groups[m]){groups[m]=[];order.push(m);}
      groups[m].push(s);
    });
    order.sort(function(a,b){return b.localeCompare(a);});
    document.getElementById('sigbody').innerHTML=order.map(function(m){
      return '<div class="h2">'+esc(m)+'<span class="tag">'+groups[m].length+' 条</span></div>'
        +'<div class="siglist">'+groups[m].map(function(s){
          return '<div class="sig" data-goto="'+esc(s.cid)+'" style="cursor:pointer">'
            +'<div class="bar" style="background:'+(DIMCOLOR[s.dimension]||'#2F6BFF')+'"></div>'
            +'<div class="body"><div class="top"><span class="co">'+esc(s.company)+'</span>'
            +'<span class="tag">'+esc(dimLabel(s.dimension))+'</span>'
            +'<span class="dt">'+esc(s.date)+'</span></div>'
            +'<div class="tx">'+esc(s.delta)+'</div>'
            +(s.impact?'<div class="im">影响：'+esc(s.impact)+'</div>':'')
            +'</div></div>';
        }).join('')+'</div>';
    }).join('');
  }
  document.getElementById('sc').onchange=function(e){sigFilter.c=e.target.value;paint();};
  document.getElementById('sd').onchange=function(e){sigFilter.d=e.target.value;paint();};
  paint();
}

/* ---------------- 监测口径 ---------------- */
function renderPlan(){
  var p=DATA.watchPlan||{};
  document.getElementById('v-plan').innerHTML=
   '<div class="h1">监测口径与管道</div>'
   +'<div class="sub">9 维监测口径、更新节奏、采集管道与数据来源说明。本页定义了「看什么、多久看一次、怎么进来」。</div>'
   +'<div class="h2">9 维监测口径</div>'
   +'<div class="kv">'+DATA.dimensions.map(function(d){
      return '<div class="cell"><b>'+(DIMCOLOR[d.key]?'<span class="dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+DIMCOLOR[d.key]+';margin-right:7px"></span>':'')
        +esc(d.label)+'</b><span>'+esc(d.hint)+'</span></div>';
    }).join('')+'</div>'
   +'<div class="h2">更新节奏</div><div class="card doc"><div class="sub">'+esc(p.cadence||'')+'</div></div>'
   +'<div class="h2">采集管道</div>'
   +'<div class="flow">'+(p.refreshFlow||[]).map(function(s){return '<div class="step">'+esc(s)+'</div>';}).join('')+'</div>'
   +'<div class="h2">数据来源</div><div class="card doc"><ul>'+(p.sources||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>'
   +'<div class="h2">监测触发条件</div><div class="card doc"><ul>'+(p.triggers||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>'
   +'<div class="h2">使用注意</div><div class="card doc"><ul>'+(p.notes||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>'
   +'<footer>'+esc(DATA.meta.sourceNote)+'<br>'+esc(DATA.meta.disclaimer)+'</footer>';
}

/* ---------------- 事件委托：卡片 / 行 → 详情 ---------------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-goto]');
  if(t){renderDetail(t.dataset.goto);show('detail');}
});

/* ---------------- 初始化 ---------------- */
renderOverview();
renderFocus();
renderPanorama();
renderSignals();
renderPlan();
</script>
