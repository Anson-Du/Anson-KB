  # 6. 触觉优先范式
  tactile_first:
    name: "触觉优先范式"
    category: "paradigm"
    description: "构建触觉世界模型，解决视觉遮挡场景"
    keywords:
      - "触觉"
      - "tactile"
      - "haptic"
      - "触觉传感器"
      - "tactile sensor"
      - "力觉"
      - "force.*sense"
      - "力反馈"
