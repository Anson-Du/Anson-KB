# ---- 报告模板设置 ----
report:
  title: "RoboX 商业模式周度分析报告"
  subtitle: "基于七范式与三重锁定框架的持续追踪"
  # Markdown 模板变量可用: {report_date}, {last_report_date}, {dimensions}, {trend_table}, {new_files}, {competitor_summary}, {version}
  include_sections:
    - overview
    - paradigm_analysis
    - lockin_analysis
    - trend_panel
    - file_manifest
    - competitor_dynamics
    - recommendations

