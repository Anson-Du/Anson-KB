# =============================================================================
# RoboX 商业模式分析工具 - 配置文件
# =============================================================================
# 按七范式和三重锁定框架定义十维度的分析规则

# ---- 全局设置 ----
global:
  workspace_root: "d:/RoboX"
  report_dir: "data/reports"
  snapshot_dir: "data/snapshots"
  log_dir: "data/logs"
  # 文档扫描目录（相对于 workspace_root）
  scan_dirs:
    - "01_战略分析"
    - "02_股权融资"
    - "03_政府合作"
    - "04_听记纪要/转写与纪要"
    - "05_行业与竞争"
    - "06_产业生态"
  # 评分权重
  weights:
    hit_density: 0.50       # 关键词命中密度权重
    evidence_strength: 0.35  # 证据强度权重（量化数据/纪要格式加分）
    freshness: 0.15          # 时间新鲜度权重

# ---- 十维度分析规则 ----
dimensions:
  # ========== 七范式（合作协同范式） ==========

  # 1. Human-Centric 范式
  human_centric:
    name: "Human-Centric 范式"
    category: "paradigm"
    description: "以人类行为数据为核心的数据采集策略"
    keywords:
      - "human centric"
      - "human-centric"
      - "人类为中心"
      - "人类行为数据"
      - "ego video"
      - "ego-centric"
      - "第一人称视角"
      - "第一视角"
      - "人类操作视频"
      - "人类操作数据"
      - "90亿人"
      - "人类数据"
      - "manipulation data"
      - "wearable"
      - "可穿戴设备"
      - "遥操作"
      - "teleoperation"
      - "tele-operat"
      - "人类演示"
      - "human demo"
      - "imitation learning"
      - "模仿学习"
    weighting: 1.0

  # 2. System 2 先行范式
  system2_first:
    name: "System 2 先行范式"
    category: "paradigm"
    description: "从大脑决策系统出发，1000万小时训练100B模型再蒸馏"
    keywords:
      - "system 2"
      - "system2"
      - "系统二"
      - "大脑决策"
      - "1000万小时"
      - "100B"
      - "蒸馏"
      - "distill"
      - "scaling law"
      - "scaling"
      - "大脑模型"
      - "brain model"
      - "Rain Brain"
      - "rain brain"
      - "决策系统"
      - "cognitive"
      - "认知模型"
      - "reasoning"
      - "推理能力"
      - "规划能力"
      - "planning"
      - "large model"
      - "大模型训练"
      - "预训练"
      - "pre-train"
    weighting: 1.2

  # 3. 手眼脑协同范式
  eye_hand_brain:
    name: "手眼脑协同范式"
    category: "paradigm"
    description: "感知（眼）、执行（手）、决策（脑）三层闭环"
    keywords:
      - "手眼脑"
      - "eye.hand.brain"
      - "感知.*执行.*决策"
      - "视觉.*动作.*规划"
      - "vision.*action"
      - "VLA"
      - "Vision-Language-Action"
      - "闭环"
      - "closed.loop"
      - "感知层"
      - "执行层"
      - "决策层"
      - "sensorimotor"
      - "感知-行动"
      - "perception.action"
      - "视觉语言动作"
      - "跨本体"
      - "cross-embodiment"
      - "embodiment"
      - "多本体"
    weighting: 1.0

  # 4. Latent 空间通信范式
  latent_communication:
    name: "Latent 空间通信范式"
    category: "paradigm"
    description: "隐空间通信替代自然语言指令"
    keywords:
      - "latent"
      - "隐空间"
      - "潜在空间"
      - "通信"
      - "自然语言.*替代"
      - "非语言.*指令"
      - "language.free"
      - "语言无关"
      - "去除.*语言"
      - "解耦.*语言"
      - "AR架构"
      - "autoregressive"
      - "同源.*生成"
      - "统一.*架构"
      - "unified.*arch"
      - "tokenization"
      - "tokenize"
      - "embedding"
      - "嵌入.*空间"
    weighting: 0.9

  # 5. 多模态数据金字塔范式
  multimodal_pyramid:
    name: "多模态数据金字塔范式"
    category: "paradigm"
    description: "真机操作→第一视角+触觉→混合视角→互联网公开数据的层级"
    keywords:
      - "数据金字塔"
      - "data pyramid"
      - "多模态"
      - "multimodal"
      - "第一视角"
      - "ego.centric"
      - "触觉"
      - "tactile"
      - "混合视角"
