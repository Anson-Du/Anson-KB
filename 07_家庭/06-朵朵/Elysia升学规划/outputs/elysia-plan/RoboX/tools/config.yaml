  # ========== 三重锁定机制 ==========

  # 8. 数据锁定
  data_lockin:
    name: "数据锁定"
    category: "lockin"
    description: "自建数据基础设施（目标50-100万小时），数据飞轮正向循环"
    keywords:
      - "数据基础设施"
